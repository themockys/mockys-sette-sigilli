<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>MOCKYS</title>

  <link rel="stylesheet" href="./css/style.css">

  <style>
    /* HOMEPAGE OVERRIDE */

    body{
      background:#000 url("./assets/img/bg-home.png") no-repeat center center fixed;
      background-size:cover;
    }

    .home{
      min-height:100vh;
      display:flex;
      justify-content:flex-start;
      align-items:flex-start;
      padding-top:48px;
    }

    .home-logo{
      width:100%;
      display:flex;
      justify-content:center;
    }

    .home-logo img{
      width:auto;
      height:140px;          /* grande, impattante */
      max-width:90vw;
      filter:
        drop-shadow(0 0 24px rgba(0,0,0,.75))
        drop-shadow(0 0 12px rgba(102,255,204,.25));
    }

    @media (max-width:700px){
      .home-logo img{
        height:96px;
      }
    }
  </style>
</head>

<body>
  <div class="home">
    <div class="home-logo">
      <img src="./assets/img/logo-mockys.png" alt="MOCKYS">
    </div>
  </div>
</body>
</html>
