<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>MOCKYS</title>

  <link rel="stylesheet" href="./css/style.css?v=3">

  <style>
    /* ==========================
       HOMEPAGE – MOCKYS GATE
       ========================== */

    body{
      filter: brightness(1.25) contrast(1.1);
    }

    .home{
      min-height:100vh;
      display:flex;
      justify-content:flex-start;
      align-items:flex-start;
      padding-top:28px;
      position:relative;
      z-index:1;
    }

    .home-inner{
      width:100%;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:18px;
      position:relative;
    }

    /* LOGO */
    .home-logo{
      display:flex;
      justify-content:center;
      width:100%;
    }
    .home-logo img{
      width:auto;
      height:320px;
      max-width:94vw;
      filter:
        drop-shadow(0 0 48px rgba(0,0,0,.9))
        drop-shadow(0 0 24px rgba(102,255,204,.4));
      /* ✅ abbassato (prima era -18px) */
      transform: translateY(10px);
    }

    /* LANGUAGE SELECT (top-right, vertical) + FRAME */
    .lang-stack{
      position:absolute;
      top:14px;
      right:16px;
      display:flex;
      flex-direction:column;
      gap:8px;
      z-index:6;
      user-select:none;

      padding:10px;
      border-radius:14px;
      background:rgba(0,0,0,.38);
      border:1px solid rgba(255,255,255,.10);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }
    .lang-stack button{
      all:unset;
      font-family:var(--mono);
      letter-spacing:0.08em;
      font-size:12px;
      line-height:1;
      padding:6px 8px;
      border-radius:8px;
      cursor:pointer;
      opacity:.55;
      transition:opacity .12s ease, transform .12s ease;
    }
    .lang-stack button:hover{
      opacity:.85;
      transform: translateX(-1px);
    }
    .lang-stack button.is-active{
      opacity:1;
      cursor:default;
      transform:none;
    }

    /* CENTRAL GLASS FRAME (text + door) */
    .gate-frame{
      margin-top:-56px;
      width: fit-content;
      max-width: 88vw;

      display:flex;
      flex-direction:column;
      align-items:center;
      gap:14px;

      padding:18px 22px;
      border-radius:18px;
      background:rgba(0,0,0,.42);
      border:1px solid rgba(255,255,255,.10);
      backdrop-filter: blur(7px);
      -webkit-backdrop-filter: blur(7px);
    }

    /* COPY (3 lines) */
    .gate-copy{
      text-align:center;
      display:flex;
      flex-direction:column;
      gap:8px;
    }
    .gate-copy .line{
      font-family:var(--mono);
      font-size:18px;
      line-height:1.35;
      text-shadow: 0 0 22px rgba(0,0,0,.75);
      opacity:.92;
    }

    /* Door icon (NOT clickable) */
    .door-wrap{
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:10px;
    }
    .door-icon{
      width:64px;
      height:64px;
      opacity:.78;
      filter:
        drop-shadow(0 0 18px rgba(0,0,0,.8))
        drop-shadow(0 0 10px rgba(102,255,204,.18));
      pointer-events:none;
    }

    /* The ONLY clickable thing */
    .door-link{
      margin-top:2px;
      font-family:var(--mono);
      font-size:14px;
      letter-spacing:0.02em;
      opacity:.82;
      cursor:pointer;
      text-decoration:none;
      transition:opacity .12s ease;
    }
    .door-link:hover{ opacity:1; }

    /* ==========================
       PHASE 1 (GENESI) – REVEAL
       ========================== */
    .phase1-msg{
      margin-top:10px;
      text-align:center;
      font-family:var(--mono);
      font-size:13px;
      line-height:1.45;
      opacity:0;
      transform: translateY(-4px);
      transition: opacity .25s ease, transform .25s ease;
      max-width: 54ch;
      color: rgba(214,247,231,.88);
      text-shadow: 0 0 18px rgba(0,0,0,.8);
    }
    body.phase1 .phase1-msg{
      opacity:1;
      transform: translateY(0);
    }

    /* ==========================
       GLITCH (activated on phase1)
       ========================== */
    .glitch-layer{
      position:fixed;
      inset:0;
      pointer-events:none;
      z-index:5;
      opacity:0;
      transition:opacity .2s ease;
      mix-blend-mode:screen;
    }

    /* scan + grain + slight chroma offset illusion */
    .glitch-layer::before{
      content:"";
      position:absolute;
      inset:-20%;
      background:
        linear-gradient(transparent 0%, rgba(255,255,255,.05) 45%, transparent 55%) 0 0 / 100% 7px;
      opacity:.18;
      animation: scan 1.4s linear infinite;
    }
    .glitch-layer::after{
      content:"";
      position:absolute;
      inset:-20%;
      background:
        radial-gradient(circle at 20% 30%, rgba(102,255,204,.08), transparent 45%),
        radial-gradient(circle at 80% 70%, rgba(255,77,109,.06), transparent 50%),
        repeating-linear-gradient(90deg, rgba(255,255,255,.02) 0 1px, transparent 1px 3px);
      opacity:.20;
      animation: jitter 0.9s steps(2,end) infinite;
      filter: blur(.2px);
    }

    body.phase1 .glitch-layer{
      opacity:1;
    }

    /* Tiny whole-page jitter */
    body.phase1 .home-inner{
      animation: microJitter 1.1s steps(2,end) infinite;
    }

    @keyframes scan{
      from{ transform: translateY(-18px); }
      to{ transform: translateY(18px); }
    }
    @keyframes jitter{
      0%{ transform: translate(0,0); }
      25%{ transform: translate(2px,-1px); }
      50%{ transform: translate(-2px,1px); }
      75%{ transform: translate(1px,2px); }
      100%{ transform: translate(0,0); }
    }
    @keyframes microJitter{
      0%{ transform: translate(0,0); }
      50%{ transform: translate(0.6px,-0.6px); }
      100%{ transform: translate(0,0); }
    }

    /* Mobile adjustments */
    @media (max-width:700px){
      .home{ padding-top:18px; }
      .home-logo img{ height:190px; transform: translateY(4px); }

      .gate-frame{
        margin-top:-24px;
        padding:14px 16px;
      }
      .gate-copy .line{ font-size:15px; }

      .lang-stack{ top:10px; right:10px; padding:8px; }
      .door-icon{ width:56px; height:56px; }

      .phase1-msg{ font-size:12px; max-width: 46ch; }
    }
  </style>
</head>

<body>
  <!-- Glitch overlay layer -->

  <div class="home">
    <div class="home-inner">

      <!-- Language stack (top-right) -->
      <div class="lang-stack" aria-label="Language selector">
        <button type="button" data-lang="en">EN</button>
        <button type="button" data-lang="es">ES</button>
        <button type="button" data-lang="fr">FR</button>
        <button type="button" data-lang="it">IT</button>
        <button type="button" data-lang="de">DE</button>
        <button type="button" data-lang="ru">RU</button>
      </div>

      <!-- LOGO MOCKYS -->
      <div class="home-logo">
        <img src="./assets/img/logo-mockys.png" alt="MOCKYS">
      </div>

      <!-- CENTRAL GLASS FRAME (copy + door + phase1) -->
      <div class="gate-frame" aria-live="polite">

        <!-- Welcome copy -->
        <div class="gate-copy">
          <div class="line" id="l1">This is the Path of Truth.</div>
          <div class="line" id="l2">They say it leads to wealth.</div>
          <div class="line" id="l3">It certainly puts everything else into question.</div>
        </div>

        <!-- Door -->
        <div class="door-wrap">
          <img class="door-icon" src="./assets/img/icons/door1.png" alt="" aria-hidden="true">
          <!-- NOTE: link no longer navigates. It triggers Phase 1 (GENESI). -->
          <a class="door-link" id="doorLink" href="#">Behind this door, the Path begins.</a>

          <!-- Phase 1 message (revealed on click) -->
          <div class="phase1-msg" id="phase1Msg"></div>
        </div>

      </div>

    </div>
  </div>

  <script>
    (function(){
      const DEFAULT_LANG = "en";
      const STORAGE_KEY = "mockys_lang";

      const lines = {
        en: [
          "This is the Path of Truth.",
          "They say it leads to wealth.",
          "It certainly puts everything else into question."
        ],
        it: [
          "Questa è la Via della Verità.",
          "Dicono che conduca alla ricchezza.",
          "Di sicuro mette in crisi tutto il resto."
        ],
        es: [
          "Este es el Camino de la Verdad.",
          "Dicen que conduce a la riqueza.",
          "Sin duda pone todo lo demás en cuestión."
        ],
        fr: [
          "Voici la Voie de la Vérité.",
          "On dit qu’elle mène à la richesse.",
          "Elle remet certainement tout le reste en question."
        ],
        de: [
          "Dies ist der Weg der Wahrheit.",
          "Man sagt, er führe zum Reichtum.",
          "Alles andere stellt er infrage."
        ],
        ru: [
          "Это Путь Истины.",
          "Говорят, он ведёт к богатству.",
          "Всё остальное он ставит под сомнение."
        ]
      };

      const doorText = {
        en: "Behind this door, the Path begins.",
        it: "Dietro questa porta inizia la Via.",
        es: "Detrás de esta puerta comienza el Camino.",
        fr: "Derrière cette porte commence la Voie.",
        de: "Hinter dieser Tür beginnt der Weg.",
        ru: "За этой дверью начинается Путь."
      };

      /* Phase 1 message (GENESI) – requested text */
      const phase1Text = {
        en: "Now you’re on the Path. If everything feels normal… it’s because you’re not looking in the right place.",
        it: "Adesso sei sulla Via. Se tutto ti sembra normale... è perché non stai guardando nel punto giusto.",
        es: "Ahora estás en el Camino. Si todo te parece normal… es porque no estás mirando en el lugar correcto.",
        fr: "Tu es maintenant sur la Voie. Si tout te paraît normal… c’est que tu ne regardes pas au bon endroit.",
        de: "Jetzt bist du auf dem Weg. Wenn alles normal wirkt… liegt es daran, dass du nicht an der richtigen Stelle hinsiehst.",
        ru: "Теперь ты на Пути. Если всё кажется обычным… значит, ты смотришь не туда."
      };

      const l1 = document.getElementById("l1");
      const l2 = document.getElementById("l2");
      const l3 = document.getElementById("l3");
      const doorLinkEl = document.getElementById("doorLink");
      const phase1MsgEl = document.getElementById("phase1Msg");
      const buttons = Array.from(document.querySelectorAll(".lang-stack button"));

      function setActiveButton(lang){
        buttons.forEach(b => b.classList.toggle("is-active", b.dataset.lang === lang));
      }

      function getSavedLang(){
        try { return localStorage.getItem(STORAGE_KEY) || DEFAULT_LANG; } catch(e){ return DEFAULT_LANG; }
      }

      function setLang(lang){
        const L = lines[lang] ? lang : DEFAULT_LANG;
        const t = lines[L];

        l1.textContent = t[0];
        l2.textContent = t[1];
        l3.textContent = t[2];

        doorLinkEl.textContent = doorText[L] || doorText[DEFAULT_LANG];

        // If Phase 1 is active, keep message in selected language
        if (document.body.classList.contains("phase1")) {
          phase1MsgEl.textContent = phase1Text[L] || phase1Text[DEFAULT_LANG];
        } else {
          // keep empty until activated
          phase1MsgEl.textContent = "";
        }

        document.documentElement.lang = L;
        setActiveButton(L);

        try { localStorage.setItem(STORAGE_KEY, L); } catch(e){}
      }

      // init language
      setLang(getSavedLang());

      // language switching
      buttons.forEach(btn => {
        btn.addEventListener("click", () => {
          const L = btn.dataset.lang;
          if (!L || btn.classList.contains("is-active")) return;
          setLang(L);
        });
      });

      // Phase 1 trigger (GENESI)
      doorLinkEl.addEventListener("click", (e) => {
        e.preventDefault();

        if (!document.body.classList.contains("phase1")) {
          document.body.classList.add("phase1");
        }

        const L = getSavedLang();
        phase1MsgEl.textContent = phase1Text[L] || phase1Text[DEFAULT_LANG];
      });
    })();
  </script>
</body>
</html>
