<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>MOCKYS</title>

  <link rel="stylesheet" href="./css/style.css">

  <style>
    /* ==========================
       HOMEPAGE – LAYOUT + BOOST
       ========================== */

    /* ✅ torna a luminosità/contrasto desiderati (solo homepage) */
    body{
      filter: brightness(1.25) contrast(1.1);
    }

    .home{
      min-height:100vh;
      display:flex;
      justify-content:flex-start;
      align-items:flex-start;
      padding-top:28px;
      position:relative;
      z-index:1; /* sopra overlay globale */
    }

    .home-inner{
      width:100%;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:18px;
    }

    .home-logo{
      display:flex;
      justify-content:center;
      width:100%;
    }

    .home-logo img{
      width:auto;
      height:320px;
      max-width:94vw;
      filter:
        drop-shadow(0 0 48px rgba(0,0,0,.9))
        drop-shadow(0 0 24px rgba(102,255,204,.4));
      transform: translateY(-18px);
    }

    /* Titolo lingua (PNG trasparente) */
    .home-title{
      margin-top:-10px;
      display:flex;
      justify-content:center;
      width:100%;
      background:none !important;
    }

    /* ✅ titolo molto più grande */
    .home-title img{
      width:auto;
      height:230px;          /* 🔺 più grande */
      max-width:96vw;
      display:block;
      background:transparent !important;
      filter:
        drop-shadow(0 0 36px rgba(0,0,0,.95))
        drop-shadow(0 0 20px rgba(102,255,204,.35));
      transform: translateY(-10px);
    }

    /* Pannello lingua */
    .lang-panel{
      width:min(720px, 92vw);
      border:1px solid rgba(102,255,204,.16);
      background:rgba(12,18,26,.72);
      border-radius:16px;
      box-shadow:var(--shadow);
      padding:14px;
    }

    .lang-row{
      display:flex;
      gap:10px;
      align-items:center;
      flex-wrap:wrap;
      justify-content:space-between;
    }

    .lang-left{
      display:flex;
      flex-direction:column;
      gap:4px;
    }

    .lang-right{
      display:flex;
      gap:10px;
      align-items:center;
      flex-wrap:wrap;
    }

    .select{
      font-family:var(--mono);
      background:rgba(0,0,0,0.55);
      border:1px solid rgba(255,255,255,0.15);
      color:var(--fg);
      padding:10px 12px;
      border-radius:10px;
      outline:none;
      font-size:14px;
      min-width: 220px;
    }

    .mini{
      font-size:12px;
      opacity:.78;
    }

    @media (max-width:700px){
      .home{ padding-top:18px; }
      .home-logo img{ height:190px; transform: translateY(-10px); }
      .home-title img{ height:150px; transform: translateY(-6px); }
      .select{ min-width: 180px; }
    }
  </style>
</head>

<body>
  <div class="home">
    <div class="home-inner">

      <!-- LOGO MOCKYS -->
      <div class="home-logo">
        <img src="./assets/img/logo-mockys.png" alt="MOCKYS">
      </div>

      <!-- TITOLO (DINAMICO PER LINGUA) -->
      <div class="home-title">
        <img id="titleImg" src="./assets/img/titles/title-en.png?v=2" alt="THE SEVEN SEALS">
      </div>

      <!-- PANNELLO LINGUA -->
      <div class="lang-panel">
        <div class="lang-row">
          <div class="lang-left">
            <div class="small muted">LANGUAGE</div>
            <div class="mini">Default: English. Your choice is saved on this device.</div>
          </div>

          <div class="lang-right">
            <select id="langSel" class="select" aria-label="Language">
              <option value="en">English</option>
              <option value="it">Italiano</option>
              <option value="fr">Français</option>
              <option value="es">Español</option>
              <option value="de">Deutsch</option>
              <option value="ru">Русский</option>
            </select>

            <a class="btn" href="./first.html" id="enterBtn">ENTER</a>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script>
    (function(){
      const DEFAULT_LANG = "en";
      const STORAGE_KEY = "mockys_lang";
      const CACHE_BUSTER = "v=2"; // aumenta quando sostituisci i PNG

      const titleImg = document.getElementById("titleImg");
      const langSel  = document.getElementById("langSel");
      const enterBtn = document.getElementById("enterBtn");

      const titleSrc = {
        en: `./assets/img/titles/title-en.png?${CACHE_BUSTER}`,
        it: `./assets/img/titles/title-it.png?${CACHE_BUSTER}`,
        fr: `./assets/img/titles/title-fr.png?${CACHE_BUSTER}`,
        es: `./assets/img/titles/title-es.png?${CACHE_BUSTER}`,
        de: `./assets/img/titles/title-de.png?${CACHE_BUSTER}`,
        ru: `./assets/img/titles/title-ru.png?${CACHE_BUSTER}`,
      };

      const enterText = {
        en: "ENTER",
        it: "ENTRA",
        fr: "ENTRER",
        es: "ENTRAR",
        de: "EINTRETEN",
        ru: "ВОЙТИ",
      };

      function setLang(lang){
        const L = titleSrc[lang] ? lang : DEFAULT_LANG;

        titleImg.src = titleSrc[L];
        enterBtn.textContent = enterText[L] || enterText[DEFAULT_LANG];
        document.documentElement.lang = L;
        langSel.value = L;

        try { localStorage.setItem(STORAGE_KEY, L); } catch(e){}
      }

      let saved = DEFAULT_LANG;
      try { saved = localStorage.getItem(STORAGE_KEY) || DEFAULT_LANG; } catch(e){}
      setLang(saved);

      langSel.addEventListener("change", (e) => {
        setLang(e.target.value);
      });
    })();
  </script>
</body>
</html>
