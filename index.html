<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>MOCKYS</title>

  <link rel="stylesheet" href="./css/style.css">

  <style>
    /* ==========================
       HOMEPAGE – OVERRIDE TOTAL
       ========================== */

    /* Sfondo più luminoso */
    body{
      background:#000 url("./assets/img/bg-home.png") no-repeat center center fixed;
      background-size:cover;
      filter: brightness(1.25) contrast(1.1);
    }

    /* Rimuove l’overlay scuro SOLO in homepage */
    body::before{
      display:none;
    }

    .home{
      min-height:100vh;
      display:flex;
      justify-content:flex-start;
      align-items:flex-start;
      padding-top:32px; /* ⬆️ più in alto (prima 64px) */
    }

    .home-logo{
      width:100%;
      display:flex;
      justify-content:center;
    }

    /* LOGO ANCORA PIÙ ENORME */
    .home-logo img{
      width:auto;
      height:320px;        /* 🔺 più grande (prima 240px) */
      max-width:94vw;
      filter:
        drop-shadow(0 0 48px rgba(0,0,0,.9))
        drop-shadow(0 0 24px rgba(102,255,204,.4));
    }

    /* Mobile */
    @media (max-width:700px){
      .home{
        padding-top:24px;
      }
      .home-logo img{
        height:190px;      /* più grande (prima 150px) */
      }
    }
  </style>
</head>

<body>
  <div class="home">
    <div class="home-logo">
      <img src="./assets/img/logo-mockys.png" alt="MOCKYS">
    </div>
  </div>
</body>
</html>
